<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="hull" x1="60" y1="120" x2="700" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5B9BC9"/>
      <stop offset="35%" stop-color="#2E6A9E"/>
      <stop offset="100%" stop-color="#163A5C"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="260" y1="150" x2="520" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4A88B8"/>
      <stop offset="100%" stop-color="#0F2F4A"/>
    </linearGradient>
    <linearGradient id="fin" x1="580" y1="30" x2="660" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E5A88"/>
      <stop offset="100%" stop-color="#0C2740"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="150" x2="140" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#0A1A2E" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- contrails -->
  <path d="M10 155 C50 150 90 154 140 162" stroke="url(#trail)" stroke-width="3" stroke-linecap="round"/>
  <path d="M6 168 C48 166 92 172 136 180" stroke="url(#trail)" stroke-width="2.2" stroke-linecap="round"/>

  <g filter="url(#soft)" transform="rotate(-8 380 160)">
    <!-- tall swept fin — widebody style -->
    <path d="M560 118 L660 28 L686 52 L602 150 Z" fill="url(#fin)"/>
    <path d="M575 95 L628 48 L636 56 L590 108 Z" fill="#7EB0D4" opacity="0.35"/>
    <path d="M568 152 L678 178 L662 198 L560 168 Z" fill="#1A4A70"/>

    <!-- longer widebody fuselage -->
    <path d="M48 155 C78 112 150 98 240 102 L540 122 C590 126 635 140 658 160 C632 188 575 200 510 198 L250 180 C150 172 90 174 48 155 Z" fill="url(#hull)"/>
    <path d="M100 168 C180 182 360 190 540 176" stroke="#7EB0D4" stroke-width="3.5" stroke-linecap="round" opacity="0.4"/>
    <path d="M48 155 C62 132 90 120 124 116" stroke="#A8CDE6" stroke-width="2.8" stroke-linecap="round" opacity="0.65"/>

    <!-- cockpit -->
    <path d="M92 138 C108 124 128 118 148 120 L154 136 C132 140 110 146 94 150 Z" fill="#0B2238" opacity="0.9"/>

    <!-- windows row -->
    <g fill="#D6E8F5">
      <circle cx="180" cy="136" r="2.8"/>
      <circle cx="200" cy="137" r="2.8"/>
      <circle cx="220" cy="138" r="2.8"/>
      <circle cx="240" cy="139" r="2.8"/>
      <circle cx="260" cy="140" r="2.8"/>
      <circle cx="280" cy="141" r="2.8"/>
      <circle cx="300" cy="142" r="2.8"/>
      <circle cx="320" cy="143" r="2.8"/>
      <circle cx="340" cy="144" r="2.8"/>
      <circle cx="360" cy="145" r="2.8"/>
      <circle cx="380" cy="146" r="2.8"/>
      <circle cx="400" cy="147" r="2.8"/>
      <circle cx="420" cy="148" r="2.8"/>
      <circle cx="440" cy="149" r="2.8"/>
      <circle cx="460" cy="150" r="2.8"/>
      <circle cx="480" cy="151" r="2.8"/>
      <circle cx="500" cy="152" r="2.8"/>
      <circle cx="520" cy="153" r="2.8"/>
    </g>

    <!-- long swept wing -->
    <path d="M280 158 L530 248 L558 228 L390 148 Z" fill="url(#wingGrad)"/>
    <!-- winglet up -->
    <path d="M530 248 L565 210 L574 220 L542 258 Z" fill="#2A628F"/>

    <!-- twin engines under wing -->
    <ellipse cx="340" cy="200" rx="34" ry="16" fill="#1A4A70" stroke="#7EB0D4" stroke-width="1.6"/>
    <ellipse cx="340" cy="200" rx="12" ry="9" fill="#0A1E30"/>
    <ellipse cx="420" cy="220" rx="30" ry="14" fill="#1A4A70" stroke="#7EB0D4" stroke-width="1.6"/>
    <ellipse cx="420" cy="220" rx="10" ry="8" fill="#0A1E30"/>
  </g>
</svg>
