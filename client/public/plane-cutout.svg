<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="body" x1="80" y1="140" x2="560" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F5F8FC"/>
      <stop offset="100%" stop-color="#D7E0EA"/>
    </linearGradient>
    <linearGradient id="wing" x1="280" y1="170" x2="460" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C5D0DC"/>
    </linearGradient>
    <linearGradient id="tailBlue" x1="520" y1="40" x2="590" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2F6FA8"/>
      <stop offset="100%" stop-color="#1A4F7A"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="160" x2="120" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="soft" x="-25%" y="-45%" width="150%" height="190%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#142B4A" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- contrails -->
  <g opacity="0.9">
    <path d="M8 168 C40 164 70 166 112 172" stroke="url(#trail)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M4 178 C38 176 72 180 108 186" stroke="url(#trail)" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M18 158 C48 154 78 156 118 162" stroke="url(#trail)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  </g>

  <g filter="url(#soft)" transform="rotate(-12 340 170)">
    <!-- dark sky blue tail -->
    <path d="M500 112 L590 36 L612 58 L545 148 Z" fill="url(#tailBlue)"/>
    <path d="M512 118 L548 70 L556 78 L528 128 Z" fill="#FFFFFF" opacity="0.22"/>
    <path d="M508 150 L600 172 L586 190 L500 164 Z" fill="#E8EEF5"/>

    <!-- fuselage white -->
    <path d="M70 152 C95 118 150 104 220 108 L470 126 C512 130 548 142 566 160 C548 182 508 192 458 190 L230 176 C150 170 100 172 70 152 Z" fill="url(#body)" stroke="#C9D4E0" stroke-width="1"/>
    <path d="M95 162 C150 174 300 182 450 172" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.55"/>

    <!-- cockpit windows -->
    <path d="M98 138 C108 128 122 124 136 126 L142 136 C128 138 112 142 100 146 Z" fill="#2A4A68" opacity="0.85"/>

    <!-- cabin windows -->
    <g fill="#2A4A68" opacity="0.8">
      <circle cx="175" cy="138" r="3"/>
      <circle cx="195" cy="139" r="3"/>
      <circle cx="215" cy="140" r="3"/>
      <circle cx="235" cy="141" r="3"/>
      <circle cx="255" cy="142" r="3"/>
      <circle cx="275" cy="143" r="3"/>
      <circle cx="295" cy="144" r="3"/>
      <circle cx="315" cy="145" r="3"/>
      <circle cx="335" cy="146" r="3"/>
      <circle cx="355" cy="147" r="3"/>
      <circle cx="375" cy="148" r="3"/>
      <circle cx="395" cy="149" r="3"/>
      <circle cx="415" cy="150" r="3"/>
      <circle cx="435" cy="151" r="3"/>
      <circle cx="455" cy="152" r="3"/>
    </g>

    <!-- main wing -->
    <path d="M270 160 L470 228 L492 212 L350 150 Z" fill="url(#wing)" stroke="#B8C5D3" stroke-width="1"/>
    <!-- winglet -->
    <path d="M470 228 L498 206 L504 214 L480 236 Z" fill="#DCE5EE" stroke="#A9B8C8" stroke-width="1"/>

    <!-- engines white -->
    <ellipse cx="320" cy="198" rx="30" ry="15" fill="#F7FAFD" stroke="#A9B8C8" stroke-width="1.5"/>
    <ellipse cx="320" cy="198" rx="11" ry="9" fill="#4A6078"/>
    <ellipse cx="385" cy="214" rx="26" ry="13" fill="#F7FAFD" stroke="#A9B8C8" stroke-width="1.5"/>
    <ellipse cx="385" cy="214" rx="9" ry="7.5" fill="#4A6078"/>

    <!-- landing gear -->
    <g stroke="#4A5564" stroke-width="2.2" stroke-linecap="round">
      <line x1="210" y1="176" x2="204" y2="214"/>
      <line x1="330" y1="188" x2="326" y2="232"/>
      <line x1="390" y1="200" x2="398" y2="240"/>
    </g>
    <g fill="#2C3540">
      <circle cx="204" cy="216" r="5"/>
      <circle cx="326" cy="234" r="5.5"/>
      <circle cx="398" cy="242" r="5.5"/>
    </g>
  </g>
</svg>
