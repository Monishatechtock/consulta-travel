services:
  - type: web
    name: consulta-travel
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run render-build
    startCommand: npm start
    # Dashboard Build Command MUST be exactly: npm run render-build
    # Do not use: yarn install && npm run build --prefix client
    # That skips client/server installs and causes "vite: not found" (exit 127).
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Travel Administrator
      - key: NOTIFY_ADMIN_EMAIL
        sync: false
      - key: NOTIFY_EXTRA_EMAILS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: CLIENT_ORIGIN
        value: "*"
